name: ChatTag Layout Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-layout:
    name: Validate layout and settings access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run layout regression tests
        run: node --import tsx --test tests/layout-cleanup.test.ts tests/quackverse-npc.test.ts tests/admin-shell-parity.test.ts tests/game-hub-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
