name: Quackverse Live Screenshot

on:
  push:
    branches:
      - fix/deploy-housekeeping-nonblocking

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture live card in Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1200,1200 \
            --screenshot=quackverse-live-card-1.png \
            'https://chat-tag-new.fly.dev/api/quackverse/art/canon?cardId=1'
          test -s quackverse-live-card-1.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: quackverse-live-card-1
          path: quackverse-live-card-1.png
          if-no-files-found: error
          retention-days: 1
