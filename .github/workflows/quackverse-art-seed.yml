name: Quackverse AI Art Seed

on:
  push:
    branches:
      - main
    paths:
      - .github/quackverse-art-seed-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quackverse-ai-art-seed
  cancel-in-progress: true

jobs:
  seed-quackverse-art:
    name: Seed Quackverse art to live volume
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Verify live apps before seeding
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app chat-tag-new
          flyctl status --app streamweaver-new
          curl --fail --show-error --retry 6 --retry-delay 5 --retry-all-errors https://chat-tag-new.fly.dev/api/health
          curl --fail --show-error --retry 6 --retry-delay 5 --retry-all-errors https://streamweaver-new.fly.dev/api/health

      - name: Generate all missing Quackverse static art with SeaArt
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app chat-tag-new -C 'node -e '"'"'
          const base = "http://127.0.0.1:3000";
          const secret = String(process.env.BOT_SECRET_KEY || "").trim();
          if (!secret) throw new Error("BOT_SECRET_KEY is unavailable inside chat-tag-new");
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getManifest() {
            const response = await fetch(base + "/api/quackverse/art", { cache: "no-store" });
            const data = await response.json().catch(() => null);
            if (!response.ok || !data) throw new Error("Could not read Quackverse art manifest: HTTP " + response.status);
            return data;
          }

          async function generateBatch() {
            const response = await fetch(base + "/api/quackverse/art/generate", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-bot-secret": secret
              },
              body: JSON.stringify({
                variant: "static",
                limit: 5,
                missingOnly: true,
                includePrompt: false,
                providerOverride: "seaart",
                model: "seaart-infinity",
                resolution: "2048x1280",
                useReferences: false
              })
            });
            const data = await response.json().catch(() => null);
            if (!response.ok || !data) throw new Error("Quackverse generation endpoint failed with HTTP " + response.status);
            const results = Array.isArray(data.results) ? data.results : [];
            const compact = results.map((item) => ({
              cardId: item?.cardId,
              name: item?.name,
              success: item?.success === true,
              provider: item?.provider,
              requestResolution: item?.requestResolution,
              error: item?.success ? undefined : String(item?.error || "unknown failure").slice(0, 500)
            }));
            console.log(JSON.stringify({ remaining: data.remaining, results: compact }, null, 2));
            return results.filter((item) => item?.success).length;
          }

          async function main() {
            let noProgress = 0;
            for (let pass = 1; pass <= 30; pass += 1) {
              const before = await getManifest();
              const cardCount = Number(before.cardCount || 0);
              const staticCount = Number(before.staticCount || 0);
              console.log(`[QuackverseSeed] pass=${pass} static=${staticCount}/${cardCount}`);
              if (cardCount === 100 && staticCount >= cardCount) break;
              if (cardCount !== 100) throw new Error(`Expected exactly 100 Quackverse cards, found ${cardCount}`);

              const successes = await generateBatch();
              if (successes > 0) {
                noProgress = 0;
              } else {
                noProgress += 1;
                console.warn(`[QuackverseSeed] no successful images on pass ${pass}; noProgress=${noProgress}`);
                if (noProgress >= 3) throw new Error("SeaArt produced zero successful images for three consecutive batches.");
                await sleep(15000);
              }
              await sleep(2500);
            }

            const finalManifest = await getManifest();
            console.log(JSON.stringify({
              cardCount: finalManifest.cardCount,
              staticCount: finalManifest.staticCount,
              missingStaticCount: finalManifest.missingStaticCount
            }, null, 2));
            if (Number(finalManifest.staticCount || 0) !== 100) {
              throw new Error(`Static art seed incomplete: ${finalManifest.staticCount || 0}/100 saved`);
            }
          }

          main().catch((error) => { console.error(error); process.exit(1); });
          '"'"''

      - name: Inspect live SeaArt image-to-video support
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          flyctl ssh console --app streamweaver-new -C 'bash -lc '"'"'
          export HOME="${SEAART_CLI_HOME:-/tmp/streamweaver-seaart-cli}"
          token="${SEAART_CLI_TOKEN:-${SEAART_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "SEAART_CLI_TOKEN/SEAART_TOKEN is not configured in streamweaver-new"
            exit 2
          fi
          seaart login --token "$token" >/dev/null 2>&1 || true
          echo "=== SEAART VERSION ==="
          seaart version || true
          echo "=== IMAGE2VIDEO HELP ==="
          seaart image2video --help || true
          echo "=== SEAART MODELS ==="
          seaart models list || true
          '"'"''

      - name: Report live art manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://chat-tag-new.fly.dev/api/quackverse/art \
            --output /tmp/quackverse-art.json
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/quackverse-art.json","utf8"));console.log(JSON.stringify({cardCount:data.cardCount,staticCount:data.staticCount,hoverCount:data.hoverCount,missingStaticCount:data.missingStaticCount,missingHoverCount:data.missingHoverCount,complete:data.complete},null,2));'
