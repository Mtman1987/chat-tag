name: Apply Discord command panels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-discord-command-panels.yml
      - scripts/apply-discord-command-panels.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply panels
        run: python3 scripts/apply-discord-command-panels.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: |
          npm run test:discord-dashboard
          npm run test:quackverse-pack
      - name: Commit production route
        run: |
          rm -f scripts/apply-discord-command-panels.py
          rm -f .github/workflows/apply-discord-command-panels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upgrade Discord collections, points, packs, and battle panels"
          git push origin main
