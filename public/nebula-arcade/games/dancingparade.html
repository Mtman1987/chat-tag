<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceMountain Cosmic Conga Line</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{pointer-events:none}
  #party{position:fixed;inset:0;display:none;overflow:hidden;background:transparent}
  #party.active{display:block}
  #fx,#cards,#parade{position:absolute;inset:0;overflow:hidden}
  #fx{z-index:5}
  #cards{z-index:20}
  #parade{z-index:15}
  #groundGlow{position:absolute;left:-5%;right:-5%;bottom:-7%;height:30%;background:radial-gradient(ellipse at center,rgba(78,222,255,.16),transparent 68%);filter:blur(10px)}
  #avatarLane,#emojiLane{position:absolute;left:0;right:0;bottom:8px;height:118px;overflow:visible}
  #emojiLane{bottom:104px;height:82px}
  .marcher,.partyEmoji{position:absolute;left:-150px;will-change:transform;animation-name:march;animation-timing-function:linear;animation-iteration-count:infinite}
  .marcher{bottom:0;width:82px;text-align:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
  .avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.92);background:rgba(17,24,39,.8);box-shadow:0 0 18px rgba(94,234,212,.65)}
  .fallbackAvatar{display:grid;place-items:center;margin:0 auto;width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.92);background:linear-gradient(135deg,#7c3aed,#06b6d4);font-size:24px;font-weight:900}
  .name{margin-top:3px;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 5px;border-radius:999px;background:rgba(2,6,23,.72);font-size:10px;font-weight:900;color:white;text-shadow:0 1px 2px #000}
  .partyEmoji{bottom:0;font-size:34px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));animation-duration:18s}
  @keyframes march{0%{transform:translateX(0) translateY(0)}25%{transform:translateX(calc(25vw + 70px)) translateY(-5px)}50%{transform:translateX(calc(50vw + 140px)) translateY(0)}75%{transform:translateX(calc(75vw + 210px)) translateY(-5px)}100%{transform:translateX(calc(100vw + 300px)) translateY(0)}}
  .wiggle{animation:seismic .16s ease-in-out infinite!important}
  @keyframes seismic{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-22px) rotate(8deg) scale(1.08)}}
  .confetti{position:absolute;top:-20px;width:9px;height:18px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(900deg);opacity:.15}}
  .spark{position:absolute;width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;animation:spark 1.1s ease-out forwards}
  @keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .cash{position:absolute;font-size:28px;animation:cash 1.8s ease-out forwards;filter:drop-shadow(0 0 9px rgba(34,197,94,.8))}
  @keyframes cash{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}18%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot));opacity:0}}
  .commandCard{position:absolute;padding:10px 16px;border:1px solid rgba(255,255,255,.3);border-radius:16px;background:linear-gradient(135deg,rgba(15,23,42,.88),rgba(76,29,149,.78));box-shadow:0 8px 28px rgba(0,0,0,.38),0 0 20px rgba(34,211,238,.2);color:white;font-size:18px;font-weight:950;letter-spacing:.02em;text-shadow:0 2px 4px #000;animation:cardPop 3.7s ease-in-out forwards;transform-origin:center}
  @keyframes cardPop{0%{opacity:0;transform:translateY(18px) scale(.72) rotate(-7deg)}14%{opacity:1;transform:translateY(0) scale(1.04) rotate(4deg)}35%{transform:translateY(-5px) scale(1) rotate(-3deg)}70%{opacity:1;transform:translateY(4px) rotate(3deg)}100%{opacity:0;transform:translateY(-22px) scale(.86) rotate(-6deg)}}
  #banner{position:absolute;top:5%;left:50%;z-index:25;transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:rgba(15,23,42,.74);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .3s}
  #party.active #banner{opacity:.88}
</style>
</head>
<body>
<div id="party" aria-hidden="true">
  <div id="groundGlow"></div>
  <div id="fx"></div>
  <div id="cards"></div>
  <div id="parade">
    <div id="emojiLane"></div>
    <div id="avatarLane"></div>
  </div>
  <div id="banner">COSMIC CONGA LINE · +100 XP FOR PARTICIPATING</div>
</div>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  const embedded=params.has('embedded');
  const channel=(params.get('channel')||'spacemountainlive').replace(/^#/,'').toLowerCase();
  if(embedded&&window.parent!==window){
    window.parent.postMessage({nebulaArcade:{type:'dancing-parade-ready',channel}},location.origin);
  }
  const party=document.getElementById('party');
  const avatarLane=document.getElementById('avatarLane');
  const emojiLane=document.getElementById('emojiLane');
  const fx=document.getElementById('fx');
  const cards=document.getElementById('cards');
  const commands=['spmt join','spmt dance','spmt <emoji>'];
  let sessionId='',danceSeq=-1,lastEmojiCount=0,cardTimer=null,fxTimer=null,pollTimer=null,audioCtx=null,musicTimer=null,beat=0;

  const esc=(value)=>String(value||'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const hash=(value)=>{let h=2166136261;for(const ch of String(value)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};

  function confetti(count=30){
    const palette=['#22d3ee','#a78bfa','#f472b6','#facc15','#34d399','#fb7185','#ffffff'];
    for(let i=0;i<count;i++){
      const el=document.createElement('i');el.className='confetti';
      el.style.left=(Math.random()*100)+'vw';el.style.background=palette[i%palette.length];
      el.style.setProperty('--drift',((Math.random()-.5)*180)+'px');
      el.style.animationDuration=(2.7+Math.random()*2.4)+'s';
      fx.appendChild(el);setTimeout(()=>el.remove(),5500);
    }
  }
  function fireworks(){
    const x=12+Math.random()*76,y=12+Math.random()*46;
    const palette=['#67e8f9','#c4b5fd','#fde047','#f9a8d4','#86efac'];
    for(let i=0;i<24;i++){
      const a=Math.PI*2*i/24,dist=45+Math.random()*95,el=document.createElement('i');
      el.className='spark';el.style.left=x+'vw';el.style.top=y+'vh';el.style.color=palette[i%palette.length];
      el.style.setProperty('--dx',(Math.cos(a)*dist)+'px');el.style.setProperty('--dy',(Math.sin(a)*dist)+'px');
      fx.appendChild(el);setTimeout(()=>el.remove(),1300);
    }
    if(Math.random()>.35) cashBurst(x,y);
  }
  function cashBurst(x=50,y=35){
    const money=['💸','💵','🪙','💰'];
    for(let i=0;i<12;i++){
      const el=document.createElement('span');el.className='cash';el.textContent=money[i%money.length];
      el.style.left=x+'vw';el.style.top=y+'vh';
      el.style.setProperty('--dx',((Math.random()-.5)*320)+'px');
      el.style.setProperty('--dy',((-80-Math.random()*260))+'px');
      el.style.setProperty('--rot',((Math.random()-.5)*720)+'deg');
      fx.appendChild(el);setTimeout(()=>el.remove(),2100);
    }
  }
  function commandCard(){
    if(!party.classList.contains('active')) return;
    const el=document.createElement('div');el.className='commandCard';el.textContent=commands[Math.floor(Math.random()*commands.length)];
    el.style.left=(8+Math.random()*68)+'%';el.style.top=(9+Math.random()*52)+'%';
    cards.appendChild(el);setTimeout(()=>el.remove(),3900);
  }
  function startAmbientFx(){
    stopAmbientFx();
    confetti(45);fireworks();setTimeout(fireworks,550);
    cardTimer=setInterval(commandCard,2600);
    fxTimer=setInterval(()=>{Math.random()>.45?fireworks():confetti(14)},2100);
  }
  function stopAmbientFx(){
    if(cardTimer)clearInterval(cardTimer);if(fxTimer)clearInterval(fxTimer);cardTimer=fxTimer=null;
  }

  function renderAvatars(session){
    const order=Array.isArray(session.participantOrder)?session.participantOrder:[];
    const people=order.map((name)=>session.participants?.[name]).filter((p)=>p&&p.joinedAvatar);
    const keep=new Set(people.map((p)=>p.username));
    [...avatarLane.children].forEach((node)=>{if(!keep.has(node.dataset.user))node.remove()});
    people.forEach((p,index)=>{
      let el=avatarLane.querySelector('[data-user="'+CSS.escape(p.username)+'"]');
      if(!el){
        el=document.createElement('div');el.className='marcher';el.dataset.user=p.username;
        el.style.animationDuration=(18+(hash(p.username)%8))+'s';
        el.style.animationDelay=(-((hash(p.username+session.id)%18000)/1000))+'s';
        const initial=esc((p.displayName||p.username||'?').slice(0,1).toUpperCase());
        el.innerHTML=(p.avatarUrl
          ? '<img class="avatar" alt="" src="'+esc(p.avatarUrl)+'">'
          : '<div class="fallbackAvatar">'+initial+'</div>')
          +'<div class="name">'+esc(p.displayName||p.username)+'</div>';
        avatarLane.appendChild(el);
      }
    });
  }
  function renderEmojis(session){
    const items=Array.isArray(session.emojis)?session.emojis:[];
    if(items.length===lastEmojiCount)return;
    lastEmojiCount=items.length;emojiLane.innerHTML='';
    items.slice(-80).forEach((emoji,index)=>{
      const el=document.createElement('span');el.className='partyEmoji';el.textContent=emoji;
      el.style.bottom=((index%3)*20)+'px';
      el.style.animationDuration=(15+(index%9))+'s';
      el.style.animationDelay=(-((index*1.37)%18))+'s';
      emojiLane.appendChild(el);
    });
  }
  function seismicWiggle(){
    [...avatarLane.children,...emojiLane.children].forEach((el)=>el.classList.add('wiggle'));
    fireworks();cashBurst(50,46);
    setTimeout(()=>[...avatarLane.children,...emojiLane.children].forEach((el)=>el.classList.remove('wiggle')),2100);
  }

  const themes=[
    [0,4,7,9,7,4,2,4],[0,7,5,9,7,12,9,5],[0,3,7,10,7,3,5,7],[0,5,9,12,9,5,7,10],[0,4,9,7,12,9,7,4]
  ];
  function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;beat=0}
  function startMusic(themeIndex=0){
    stopMusic();
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      audioCtx.resume?.();
      const pattern=themes[Math.abs(Number(themeIndex)||0)%themes.length];
      musicTimer=setInterval(()=>{
        if(!audioCtx||audioCtx.state==='closed')return;
        const now=audioCtx.currentTime,root=110*Math.pow(2,(pattern[beat%pattern.length])/12);
        const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
        osc.type=(beat%4===0?'square':'triangle');osc.frequency.value=root*(beat%2?2:1);
        gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.035,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.18);
        osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.2);
        if(beat%4===0){
          const kick=audioCtx.createOscillator(),kg=audioCtx.createGain();kick.frequency.setValueAtTime(90,now);kick.frequency.exponentialRampToValueAtTime(40,now+.11);
          kg.gain.setValueAtTime(.06,now);kg.gain.exponentialRampToValueAtTime(.0001,now+.12);kick.connect(kg);kg.connect(audioCtx.destination);kick.start(now);kick.stop(now+.13);
        }
        beat++;
      },250);
    }catch{}
  }

  function begin(session){
    sessionId=session.id;danceSeq=Number(session.danceSeq||0);lastEmojiCount=-1;
    party.classList.add('active');party.setAttribute('aria-hidden','false');
    avatarLane.innerHTML='';emojiLane.innerHTML='';cards.innerHTML='';fx.innerHTML='';
    renderAvatars(session);renderEmojis(session);startAmbientFx();startMusic(session.themeIndex);
    commandCard();
  }
  function end(){
    sessionId='';danceSeq=-1;lastEmojiCount=0;
    party.classList.remove('active');party.setAttribute('aria-hidden','true');
    stopAmbientFx();stopMusic();avatarLane.innerHTML='';emojiLane.innerHTML='';cards.innerHTML='';fx.innerHTML='';
  }
  function sync(payload){
    if(!payload?.active||!payload?.session){if(sessionId)end();return}
    const session=payload.session;
    if(session.id!==sessionId)begin(session);
    renderAvatars(session);renderEmojis(session);
    const nextDance=Number(session.danceSeq||0);
    if(danceSeq>=0&&nextDance>danceSeq)seismicWiggle();
    danceSeq=nextDance;
  }
  async function poll(){
    try{
      const res=await fetch('/api/game-hub/parade?channel='+encodeURIComponent(channel),{cache:'no-store'});
      if(res.ok)sync(await res.json());
    }catch{}
  }
  poll();pollTimer=setInterval(poll,700);
})();
</script>
</body>
</html>
