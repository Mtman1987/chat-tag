name: Apply Fly log bot fix

on:
  push:
    branches:
      - fix/fly-log-batch-20260812
    paths:
      - ".github/workflows/apply-fly-log-bot-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/fly-log-batch-20260812
          fetch-depth: 0
      - name: Stop retrying removed DSH Twitch event endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bot.js')
          text = path.read_text()

          old = "let dshErrorSuppressedUntil = 0;\nlet dshErrorCount = 0;\nconst DSH_ERROR_WINDOW_MS = 60000;"
          new = "let dshErrorSuppressedUntil = 0;\nlet dshErrorCount = 0;\nlet dshLegacyEndpointUnavailable = false;\nconst DSH_ERROR_WINDOW_MS = 60000;"
          if old not in text:
              raise SystemExit('DSH forwarding state block not found')
          text = text.replace(old, new, 1)

          old = "async function forwardToDSH(eventData) {\n  try {"
          new = "async function forwardToDSH(eventData) {\n  if (dshLegacyEndpointUnavailable) {\n    return { success: false, status: 404, skipped: true };\n  }\n\n  try {"
          if old not in text:
              raise SystemExit('forwardToDSH entry not found')
          text = text.replace(old, new, 1)

          old = "    if (!r.ok) {\n      if (Date.now() < dshErrorSuppressedUntil) return { success: false, status: r.status };"
          new = "    if (!r.ok) {\n      if (r.status === 404) {\n        dshLegacyEndpointUnavailable = true;\n        console.log('[DSH] Legacy Twitch event endpoint is not available; disabling Chat Tag forwarding for this process. DSH direct Twitch monitoring remains authoritative.');\n        return { success: false, status: r.status, skipped: true };\n      }\n      if (Date.now() < dshErrorSuppressedUntil) return { success: false, status: r.status };"
          if old not in text:
              raise SystemExit('DSH non-ok handling block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:auth-routing
          npm run test:workspace-theme
          npm run test:crowns
          npm run test:crown-rewards
          npm run test:discord-dashboard
          npm run test:quackverse-pack
          npm run build
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-fly-log-bot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stop retrying removed DSH event endpoint"
          git push origin HEAD:fix/fly-log-batch-20260812
