name: Quackverse AI Art Seed

on:
  push:
    branches:
      - main
    paths:
      - .github/quackverse-art-seed-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quackverse-ai-art-seed
  cancel-in-progress: true

jobs:
  seed-static-art:
    name: Seed missing Quackverse static art
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Verify live app before seeding
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app chat-tag-new
          curl --fail --show-error --retry 6 --retry-delay 5 --retry-all-errors https://chat-tag-new.fly.dev/api/health

      - name: Generate exactly five missing cards
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app chat-tag-new -C 'node -e '"'"'
          const base = "http://127.0.0.1:3000";
          const secret = String(process.env.BOT_SECRET_KEY || "").trim();
          const providerOverride = String(process.env.QUACKVERSE_IMAGE_PROVIDER || "seaart").trim();
          if (!secret) throw new Error("BOT_SECRET_KEY is unavailable inside chat-tag-new");
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function main() {
            const response = await fetch(base + "/api/quackverse/art/generate", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-bot-secret": secret
              },
              body: JSON.stringify({
                variant: "static",
                limit: 5,
                missingOnly: true,
                includePrompt: true,
                providerOverride
              })
            });
            const data = await response.json().catch(() => null);
            console.log(JSON.stringify({ status: response.status, data }, null, 2));
            if (!response.ok) throw new Error("Quackverse generation endpoint failed with HTTP " + response.status);
            const successes = Array.isArray(data?.results) ? data.results.filter((item) => item?.success).length : 0;
            if (successes === 0) throw new Error("The five-card test produced zero successful images.");
            console.log("Five-card test completed with " + successes + " successful images.");
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          '"'"''

      - name: Report live art manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://chat-tag-new.fly.dev/api/quackverse/art \
            --output /tmp/quackverse-art.json
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/quackverse-art.json","utf8"));console.log(JSON.stringify({cardCount:data.cardCount,staticCount:data.staticCount,missingStaticCount:data.missingStaticCount,complete:data.complete},null,2));if(Number(data.staticCount||0)<1)process.exit(1)'
