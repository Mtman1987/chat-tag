name: Quackverse Post-Recovery Audit

on:
  push:
    branches:
      - diagnose-quackverse-collection-20260816

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify recovered live collection remains canonical
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a chat-tag-new -C "node -e 'const fs=require(\"fs\");const s=JSON.parse(fs.readFileSync(\"/data/app-state.json\",\"utf8\"));const c=s.quackverse?.collections||{};const legacy=\"user_94371378\";const split=\"user_d696355b-e13a-408b-b21a-bcfa8dec15e0\";const rooms=Object.values(s.quackverseRooms||{});console.log(JSON.stringify({mtmanCards:c[legacy]?.cards?.length||0,splitStillPresent:Boolean(c[split]),openedToday:c[legacy]?.openedToday||0,openedAtDay:c[legacy]?.openedAtDay||\"\",roomsStillUsingSplit:rooms.filter(r=>r?.claimedPlayers?.playerOne===split||r?.claimedPlayers?.playerTwo===split||Boolean(r?.collections?.[split])).length,splitPackEvents:(s.quackversePackOpens||[]).filter(e=>e?.userId===split||e?.userId===split.replace(/^user_/,\"\")).length}));'"
